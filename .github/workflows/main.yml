name: RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Disabling IE Enhanced Security Configuration
        run: |
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\{A509B1A7-37EF-4b3f-8CFC-4F3A74704013}" -Name "IsInstalled" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\{A509B1A8-37EF-4b3f-8CFC-4F3A74704013}" -Name "IsInstalled" -Value 0 -Force
          Write-Host "RDP Ready!"
